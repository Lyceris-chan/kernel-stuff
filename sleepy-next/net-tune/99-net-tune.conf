# net-tune.sh applies these at network-online, but they live only in the
# running kernel, so any later `sysctl --system` re-applies
# /usr/lib/sysctl.d/70-cachyos-settings.conf (netdev_max_backlog = 4096) and
# silently reverts them. Declaring them here too means --system lands on the
# same values; net-tune still re-asserts them per interface at boot.
net.core.netdev_max_backlog = 1000
net.core.busy_poll = 50
net.core.busy_read = 50
