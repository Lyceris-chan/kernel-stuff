# Install to /etc/tmpfiles.d/99-marie-low-swappiness-mode.conf
#
# Sets LRU-MARIE's low_swappiness_mode to 1 - its DEFAULT, deliberately.
#
# This file previously set it to 0, on the theory that clearing the clamp would
# let vm.swappiness = 180 reach the reclaim picker and stop reclaim running
# file-dominant. That was WRONG, and it made the machine slow.
#
# MARIE's reclaim driver clamps the effective swappiness:
#
#     u8 configured = (u8)mem_cgroup_swappiness(memcg);
#     u8 swappiness = (READ_ONCE(marie_low_swappiness_mode) && configured > 1) ?
#                     1 : configured;
#
# With the knob at 0 and vm.swappiness = 180, MARIE's proportional bias
# controller picks ANON almost exclusively (an anon reclaim advances the bias
# by 180 per page, a file reclaim only -20). Measured over one boot:
#
#   pgsteal_anon        201,545,880     pgsteal_file          3,537,572
#   workingset_refault_anon 192,572,097
#   PSI memory full avg10        16.05
#
# 57x more anon than file reclaimed, and 192 MILLION anon refaults: every anon
# page reclaimed was faulted straight back. PSI "full" at 16% means ALL tasks
# were stalled on memory a sixth of the time. That is the sluggishness.
#
# The workload explains why. This machine holds ~27 GB of page cache against
# only ~2.3 GB of anonymous memory, and the anon is the LIVE desktop working
# set. Reclaiming it is the one thing that cannot work. With the knob back at
# 1 (MARIE_PICK_FILE_THEN_ANON, file first) reclaim targets the 27 GB of
# largely-cold cache instead, and the pressure collapses - measured 60 seconds
# after the change: PSI memory full avg10 3.24 -> 0.02, anon reclaim 201545880
# -> 201546000 (+120 pages), file reclaim resuming at ~2M/minute.
#
# So MARIE's default is correct here and this file exists to keep it, not to
# change it. vm.swappiness is still 180 via 99-zswap-swappiness.conf; MARIE
# clamping it to 1 is the intended interaction, not a bug. Earlier claims that
# the clamp was "the OOM fix" are retracted - the kills were the thrash
# watchdog (see marie-thrash-watchdog.conf), which is a separate mechanism.
w /sys/kernel/mm/lru_marie/low_swappiness_mode - - - - 1
