# Install to /etc/tmpfiles.d/99-marie-low-swappiness-mode.conf
#
# Clears LRU-MARIE's low_swappiness_mode, which is the knob that made this
# machine OOM-kill processes on 2026-09-22.
#
# WHAT IT DOES. MARIE's reclaim driver (mm/lru_marie/state.c, the shrink_lruvec
# entry point) clamps the effective swappiness before picking between the anon
# and file lists:
#
#     u8 configured = (u8)mem_cgroup_swappiness(memcg);
#     u8 swappiness = (READ_ONCE(marie_low_swappiness_mode) && configured > 1) ?
#                     1 : configured;
#
# with marie_low_swappiness_mode defaulting to 1. So a deliberate
# vm.swappiness = 180 has never had any effect on this machine: the effective
# value has always been 1. MARIE's own header states it plainly -- the clamp
# applies "regardless of the higher values vm.swappiness / memory.swappiness
# udev rules, tuning daemons, or distro defaults have installed". The clamp
# only ever lowers, so an explicit swappiness = 0 is still honoured.
#
# WHY THAT IS WRONG HERE. swappiness = 1 makes reclaim file-dominant, and
# flushing file pages is the expensive direction on a machine whose swap is in
# RAM: a file page evicted to make room is re-read from the NVMe, while an
# anonymous page is merely compressed and can be uncompressed faster than the
# disk read it displaced. The distro zram udev rule says the same thing:
# "it is better to prefer page out only anonymous pages ... it is recommended
# to use high values from 100 to keep the page cache as hermetic as possible,
# because otherwise it is expensive to read data from disk again".
#
# Measured on this machine over one boot: pgsteal_file 31,181,709 against
# pgsteal_anon 8,779,224 -- file reclaimed 3.55x more than anon, the exact
# inversion of the configured intent -- with workingset_refault_file and
# workingset_refault_anon both around 6.8M, i.e. both lists thrashing.
#
# WHAT IT COST. On 2026-09-22 at 21:14:27 MARIE's own thrash-livelock watchdog
# (thrash_wd_fn, mm/oom_kill.c) invoked the OOM killer and killed electron
# (Discord). Its premise is that "the working set provably does not fit in
# RAM", but at that moment free swap was 27,235,488 kB of 32,432,124 kB
# (84% free), 21,599,852 kB of clean inactive page cache was still resident,
# and only 685 MB was free. The watchdog's escape gate is `free > high`; the
# zone highs sum to 219,589 pages (857 MB), so 685 MB sat below it, the gate
# never tripped, and after 8 consecutive 2-second windows of refault:steal
# at or above 1:2 it fired.
#
# Clearing this knob lets the configured swappiness reach the pick driver, so
# the ~6 GB anonymous working set can actually move into the compressed swap
# instead of the file cache being ground through the disk.
#
# The sysfs file exists as soon as the built-in LRU-MARIE initialises, well
# before tmpfiles runs, so `w` is safe here. It is re-asserted on every boot.
w /sys/kernel/mm/lru_marie/low_swappiness_mode - - - - 0
