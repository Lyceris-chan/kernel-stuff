# Install to /etc/sysctl.d/99-zswap-swappiness.conf
#
# Compressed swap makes swapping cheap, so prefer reclaiming anonymous pages
# over dropping page cache.
#
# 180, not the 150 the zram udev rule installs. Two independent sources put
# in-memory/fast swap above 150:
#
#   * The kernel's own documentation (Documentation/admin-guide/sysctl/vm.rst)
#     defines swappiness as a relative IO cost over 0-200 where 100 means equal
#     cost between swap and filesystem paging, and says "For in-memory swap,
#     like zram or zswap, as well as hybrid setups that have swap on faster
#     devices than the filesystem, values beyond 100 can be considered". Its
#     worked example gives 133 when swap is 2x faster than the filesystem.
#     This machine's swap is a zswap pool in RAM in front of an NVMe file --
#     both far faster than that example.
#   * The Arch Wiki's Zram article recommends vm.swappiness = 180 alongside
#     watermark_boost_factor = 0, watermark_scale_factor = 125 and
#     page-cluster = 0 -- the other three are already set in
#     /etc/sysctl.d/99-custom-tweaks.conf, so this completes that set.
#
# The kernel documentation is explicit that this is not an exact science: "An
# optimal value will require experimentation and will also be
# workload-dependent."
#
# IMPORTANT -- this only takes effect because LRU-MARIE's clamp is cleared.
# MARIE's low_swappiness_mode forces the effective swappiness to at most 1
# whatever is set here, and it defaults ON; it did so on this machine for as
# long as MARIE has been carried. See marie-low-swappiness-mode.conf. Setting
# this file without that one does nothing.
vm.swappiness = 180
