# Install to /etc/sysctl.d/99-zswap-swappiness.conf
#
# 1, not 180. This file previously argued at length for 180 and was wrong in
# two separate ways.
#
# FIRST, 180 did nothing. MARIE's reclaim driver clamps the effective value:
#
#     u8 configured = (u8)mem_cgroup_swappiness(memcg);
#     u8 swappiness = (READ_ONCE(marie_low_swappiness_mode) && configured > 1) ?
#                     1 : configured;
#
# With low_swappiness_mode on - its default, and correct here - any configured
# value above 1 is replaced by 1 before the reclaim picker ever sees it. So
# /proc/sys/vm/swappiness reading 180 was a statement about a number nothing
# consumed. That dead value is what sent two diagnoses wrong: it looked like
# aggressive anon reclaim was in force when the opposite was true.
#
# SECOND, 180 would have been actively harmful if it HAD applied. Clearing the
# clamp to make it apply made MARIE reclaim anon almost exclusively, against
# ~2.3 GB of live desktop working set and 27 GB of largely-cold page cache.
# Measured result: 201M anon steals, 192M anon refaults, PSI memory full at
# 16% - every task stalled on memory a sixth of the time. File-first is what
# this workload needs.
#
# Setting 1 makes the file agree with what the machine actually does. It is
# also honoured either way, since the clamp only ever LOWERS swappiness and 1
# is already at the floor. Note that 0 is special and still honoured with the
# clamp on: it means "never swap, OOM rather than touch anon", which is not
# what we want here.
#
# The effective policy is therefore: reclaim file first, anon only when file
# is exhausted. See marie-low-swappiness-mode.conf for the clamp itself and
# marie-thrash-watchdog.conf for the livelock detector that guards it.
vm.swappiness = 1
