# Compressed RAM swap (zswap backing an xswap device) makes swapping cheap, so
# prefer reclaiming anonymous pages over dropping page cache.
#
# 180, not the 150 CachyOS's zram udev rule used to set. Two independent
# sources put in-memory swap above 150:
#
#   * The kernel's own documentation (Documentation/admin-guide/sysctl/vm.rst)
#     defines swappiness as a relative IO cost over 0-200 where 100 means equal
#     cost between swap and filesystem paging, and says "for in-memory swap,
#     like zram or zswap, as well as hybrid setups that have swap on faster
#     devices than the filesystem, values beyond 100 can be considered". Its
#     worked example gives 133 when swap is 2x faster than the filesystem
#     (x + 2x = 200, 2x = 133.33). This device has no backing store at all, so
#     its "IO" is a compress and decompress in RAM -- faster than that example
#     by a wide margin.
#   * The Arch Wiki's Zram article ("Optimizing swap on zram") recommends
#     vm.swappiness = 180, together with watermark_boost_factor = 0,
#     watermark_scale_factor = 125 and page-cluster = 0. The other three of
#     those four are already set in /etc/sysctl.d/99-custom-tweaks.conf, so
#     this completes the set rather than mixing two different schemes.
#
# The kernel documentation is explicit that this is not an exact science:
# "An optimal value will require experimentation and will also be
# workload-dependent." 180 is the documented choice for this class of setup;
# 150 was only ever CachyOS's zram default preserved for continuity.
vm.swappiness = 180
