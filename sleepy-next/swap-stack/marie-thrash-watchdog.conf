# Install to /etc/tmpfiles.d/99-marie-thrash-watchdog.conf
#
# Disables LRU-MARIE's thrash-livelock watchdog.
#
# It fires by choice, not as a last resort: mm/oom_kill.c thrash_wd_fn()
# invokes the OOM killer itself once free memory sits below the zone high
# watermark AND the refault:steal ratio stays at or above ~1:2 for 8
# consecutive 2-second windows. Its stated premise is that the working set
# does not fit in RAM.
#
# Measured on this machine 2026-09-23 at the moment of a kill:
#
#   AnonPages       76,760 kB    (75 MB - almost no anonymous memory)
#   Cached      29,633,720 kB    (28.2 GB page cache)
#   MemAvailable 28,873,680 kB   (28.8 GB available)
#   free            50,030 pages (195 MB)  -> below high, so the gate is armed
#   net-progress   651269 refault / 675247 steal  (~96%)
#
# 28.8 GB was available. That is not exhaustion, and the premise was false.
# What the watchdog actually measured is a RATIO, which also runs high during
# ordinary page-cache churn on a machine holding 28 GB of cache: reclaim a
# cold file page, something reads it again, both counters tick.
#
# The cost is a standing kill loop rather than an occasional misfire.
# THRASH_WD_BACKOFF is 60 s and the window is 8 x 2 s, so it re-arms and fires
# roughly every 80 seconds for as long as the condition holds - which on a
# cache-heavy desktop is more or less permanently. Measured: three kills at
# 12:44:45, 12:46:05 and 12:47:20, all of xdg-desktop-por. All three landed
# during a kernel build's PATCH phase, before anything was compiled, so
# compiler memory was not involved.
#
# Re-enable with `echo 1 > /proc/sys/vm/thrash_wd_mode` if a real livelock is
# ever suspected. Check `workingset_refault_*` against `pgsteal_*` AND whether
# free memory is genuinely exhausted - the ratio alone does not distinguish
# a treadmill from ordinary churn.
w /proc/sys/vm/thrash_wd_mode - - - - 0
