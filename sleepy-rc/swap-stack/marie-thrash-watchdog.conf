# Install to /etc/tmpfiles.d/99-marie-thrash-watchdog.conf
#
# Keeps LRU-MARIE's thrash-livelock watchdog ENABLED - its default.
#
# This file previously DISABLED it, on the reading that it was firing
# spuriously: it had killed xdg-desktop-por three times in three minutes while
# the machine showed 28.8 GB available and only 75 MB of anonymous memory.
# "The working set does not fit in RAM" was plainly not true, so the watchdog
# looked broken and was switched off.
#
# That was treating a symptom. The watchdog was right and the thrash was real.
#
# Its counter is
#
#     refaults = WORKINGSET_REFAULT_ANON + WORKINGSET_REFAULT_FILE
#
# and vm.swappiness had been raised to 180 by clearing low_swappiness_mode,
# which made MARIE's bias controller pick ANON almost exclusively. That
# produced 192 MILLION anon refaults against 201M anon steals - a reclaim
# loop making no net progress, which is precisely the livelock the watchdog
# exists to detect. It fired because the machine WAS thrashing. The remedy it
# chose (kill the top-badness task) is the designed one; the root cause was
# the reclaim policy, which is fixed in marie-low-swappiness-mode.conf.
#
# Verified by re-arming it and rebuilding, 2026-09-23:
#
#                         swappiness=180    swappiness=1 (now)
#   watchdog firings      3 in 3 min        0
#   kills                 3                 0
#   refault:steal ratio   ~0.95             0.155
#   steals per refault    ~1 (thrashing)    6.5 (reclaim working)
#
# Both columns are window deltas over a build, NOT cumulative readings. The
# cumulative workingset_refault_* counters never reset, so long after the fix
# /proc/vmstat still yields a cumulative ratio near 0.89 - the 192M anon
# refaults from the bad window never leave the total. Measure deltas, or the
# fix looks like it did nothing.
#
# Re-measured 2026-09-23 over a 90s window with reclaim active: ratio 0.151,
# 6.62 steals per refault - the table holds. steal_file 1,500,435 vs
# steal_anon 542,127, so reclaim is file-first as intended.
#
# Measured again across a full kernel compile - the load that used to trigger
# the watchdog: ratio 0.303, 3.30 steals per refault, 0 firings. The watchdog
# fires on a sustained ratio near 1:2, so 0.303 is clear even at peak load.
#
# So the condition it detects no longer holds, and the safety net is back on.
# Its premise is still a ratio rather than a direct measure of exhaustion, so
# a future false positive is not impossible - but it should be disproved by
# the same test (arm it, load the machine, measure refaults against steals)
# rather than switched off on the strength of a memory reading alone.
w /proc/sys/vm/thrash_wd_mode - - - - 1
