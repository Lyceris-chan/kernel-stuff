# net-tune configuration — CAKE SQM + low-latency ethernet tuning.
# Each part is independent: set ENABLE_SQM / ENABLE_LATENCY to yes/no.

# CAKE SQM (bufferbloat shaping). Bandwidth in Mbit/s — set a few percent
# under your real sync rate. Leave disabled unless you know your line rate.
ENABLE_SQM=no
DOWNLOAD_MBIT=80
UPLOAD_MBIT=85

# Low-latency ethernet tuning (WOL off, GRO/offloads off, coalescing, EEE off,
# small ring buffers, busy-poll sysctls).
ENABLE_LATENCY=yes

# Optional: override the auto-detected interface (e.g. IFACE=enp3s0).
#IFACE=
